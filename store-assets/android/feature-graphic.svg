<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3514"/>
      <stop offset="0.58" stop-color="#2d4f1e"/>
      <stop offset="1" stop-color="#3e6b2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5e6cc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5e6cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10200b" flood-opacity="0.38"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="634" y="85" width="330" height="330" rx="70"/>
