  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>
  <circle cx="815" cy="250" r="300" fill="url(#glow)"/>
  <circle cx="77" cy="55" r="94" fill="#e27d60" opacity="0.08"/>
  <circle cx="585" cy="468" r="155" fill="#f5e6cc" opacity="0.04"/>

  <g transform="translate(82 108)">
    <text x="0" y="92" fill="#f5e6cc" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">Impulse</text>
    <rect x="0" y="119" width="92" height="7" rx="3.5" fill="#e27d60"/>
    <text x="0" y="178" fill="#faf2e6" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">Fake Shopping Simulator</text>
    <text x="0" y="231" fill="#f5e6cc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" opacity="0.9">Browse. Build carts. Spend nothing.</text>
  </g>

  <rect x="617" y="68" width="364" height="364" rx="86" fill="#faf2e6" opacity="0.12" filter="url(#shadow)"/>
  <image href="../../mobile/assets/branding/impulse-app-icon-master.png" x="634" y="85" width="330" height="330" preserveAspectRatio="xMidYMid slice" clip-path="url(#iconClip)"/>
  <rect x="634" y="85" width="330" height="330" rx="70" fill="none" stroke="#f5e6cc" stroke-width="3" opacity="0.65"/>
